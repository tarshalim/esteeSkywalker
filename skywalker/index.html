    <!-- Paint the theme background before the JS bundle loads so there's no white flash
         between the splash screen and first render (mirrors src/lib/theme.jsx). -->
    <style>html{background:#fafaf9}html.dark{background:#0f172a;color-scheme:dark}</style>
    <script>
      try {
        var t = localStorage.getItem("skywalker-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

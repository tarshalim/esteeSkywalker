name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skywalker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: skywalker/.nvmrc
          cache: npm
          cache-dependency-path: skywalker/package-lock.json

      - run: npm ci
      - run: npm run lint
      # No Supabase env vars here, so this builds the localStorage mock mode.
      - run: npm run build
      # Skipped until §0 adds a test harness and an npm test script.
      - run: npm run test --if-present
